openapi: 3.0.3
info:
  title: RepairCalc Frontend API
  version: 1.0.0
  description: |
    Контракт Java API каталога/расчёта товара и отдельного Python-сервиса materials.
    Общая смета и рекомендации пока запланированы.
    Внешний Bagisto API каталога не совместим с этим контрактом без нормализации.
    Витрина ограничена товарами для виджета. Административные сессии и CRUD черновиков реализованы; массовый импорт пока запланирован.
    Денежные значения передаются десятичными строками в RUB.
    Нельзя считать неизвестные фасовку, расход или совместимость подтверждёнными.
    Административный CRUD защищён серверной сессией и CSRF; см. admin-catalog-api.json.
servers:
  - url: /api/v1
    description: Same-origin API через Vite или nginx proxy
tags:
  - name: Admin
  - name: Catalog
  - name: Estimates
  - name: Recommendations
paths:
  /admin/session:
    $ref: './admin-catalog-api.json#/paths/~1session'
  /admin/login:
    $ref: './admin-catalog-api.json#/paths/~1login'
  /admin/logout:
    $ref: './admin-catalog-api.json#/paths/~1logout'
  /admin/products:
    $ref: './admin-catalog-api.json#/paths/~1products'
  /admin/products/{id}:
    $ref: './admin-catalog-api.json#/paths/~1products~1{id}'
  /admin/products/{id}/history:
    $ref: './admin-catalog-api.json#/paths/~1products~1{id}~1history'
  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      summary: Получить нормализованную витрину товаров для виджета
      description: Не сырой каталог и не все SKU магазина. Пустой список допустим.
      responses:
        '200':
          description: Товары витрины
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /estimate:
    post:
      operationId: createEstimate
      tags: [Estimates]
      summary: Рассчитать материалы и ориентировочные работы по проекту
      description: |
        Backend повторно проверяет геометрию, выбранные товары, цену и совместимость.
        selections содержит ключи roomId:productKind и значения productId.
        Неподходящие или устаревшие выбранные товары нельзя молча заменять.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
            example:
              project:
                object: apartment
                renovation: capital
                rooms:
                  - id: room-1
                    name: Санузел
                    type: bathroom
                    length: 3
                    width: 2
                    height: 2.7
                    openings: 2
                    humidity: high
                    load: normal
                    heated: true
                    works: [floor, paint]
                    reserve: 10
                    layers: 2
                    sockets: 2
                    cableLength: 12
              selections: {}
      responses:
        '200':
          $ref: '#/components/responses/Estimate'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /recommendations:
    post:
      operationId: recommendProducts
      tags: [Recommendations]
      summary: Подобрать товары по условиям комнаты с объяснениями
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationsRequest'
      responses:
        '200':
          description: Подходящие товары и ограничения; пустой список допустим
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /product/{id}/calc:
    post:
      operationId: calculateProduct
      tags: [Estimates]
      summary: Рассчитать потребность и целые упаковки одного товара
      description: |
        Возвращает Estimate с одной строкой и labor = "0.00".
        Для покрытий/красок/смесей area означает площадь обрабатываемой поверхности.
        Обои используют perimeter и height, розетки/кабель — quantity в единице товара.
        Применяемые нормы, подрезка, запас и слои определяются версионированным профилем правил с источником.
        Все поля обязательны и проверяются по своим ограничениям; поля вне выбранной стратегии не участвуют в арифметике.
        Текущий подготовленный набор использует явно помеченные учебные данные, не нормы производителя.
        Для клея поддержан только тестовый профиль 4 кг/м² для условно ровного основания;
        толщина слоя, технология и пригодность материала для объекта этим запросом не проверяются.
        Для обоев приняты подрезка 0,10 м, подгон длины по известному раппорту и запас до округления полотен;
        проёмы не вычитаются. Неизвестный раппорт не считается нулевым.
      parameters:
        - name: id
          in: path
          required: true
          description: Нормализованный ID товара, не произвольно выбранный JSON/XML ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              area: 20
              perimeter: 18
              height: 2.7
              reserve: 10
              layers: 2
              quantity: 6
      responses:
        '200':
          description: Расчёт одного товара без стоимости работ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEstimate'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /materials/estimate:
    post:
      operationId: estimateMaterialWithAssistant
      tags: [Estimates]
      summary: Расчёт товара через Ollama tool calling и пояснение модели
      description: |
        Отдельный Python-сервис вызывает Ollama, исполняет calculate_material_cost с пустыми
        аргументами через Java API и запрашивает пояснение. Суммы берутся только из estimate.
        Текст explanation не проверен на достоверность. При сбое пояснения рассчитанная смета
        сохраняется, explanationStatus=unavailable. Отсутствие tool call не заменяется демо.
        Два обращения к модели могут занять несколько минут (socket timeout 600 с каждое).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
      responses:
        '200':
          description: Проверенная Java-смета и отдельно справочное пояснение модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialEstimate'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '502':
          description: Модель не выполнила обязательный вызов tool или ответ некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /materials/calculate:
    post:
      operationId: calculateMaterialWithoutAssistant
      tags: [Estimates]
      summary: Детерминированный расчёт через Python-сервис без вызова Ollama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
      responses:
        '200':
          description: Java-смета, baseline и сведения о поправке без пояснения модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCalculation'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    AdminCookie:
      $ref: './admin-catalog-api.json#/components/securitySchemes/AdminCookie'
    AdminCsrf:
      $ref: './admin-catalog-api.json#/components/securitySchemes/AdminCsrf'
  schemas:
    MaterialRequest:
      type: object
      required: [productId, input]
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        input:
          $ref: '#/components/schemas/ProductInput'
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
        useCorrection:
          type: boolean
          default: false
    MaterialCorrection:
      type: object
      required: [applied, version, factor]
      properties:
        applied:
          type: boolean
        version:
          type: string
        factor:
          type: string
          pattern: '^\d+(\.\d+)?$'
        originalReserve:
          type: string
        effectiveReserve:
          type: string
    MaterialCalculation:
      type: object
      required: [status, estimate, baseline, correction, model]
      properties:
        status:
          type: string
          enum: [ok]
        estimate:
          $ref: '#/components/schemas/ProductEstimate'
        baseline:
          $ref: '#/components/schemas/ProductEstimate'
        correction:
          $ref: '#/components/schemas/MaterialCorrection'
        model:
          type: string
    MaterialEstimate:
      type: object
      required: [status, estimate, baseline, correction, model, toolCalls, explanation, explanationStatus]
      properties:
        status:
          type: string
          enum: [ok]
        estimate:
          $ref: '#/components/schemas/ProductEstimate'
        baseline:
          $ref: '#/components/schemas/ProductEstimate'
        correction:
          $ref: '#/components/schemas/MaterialCorrection'
        model:
          type: string
          minLength: 1
        toolCalls:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [calculate_material_cost]
        explanation:
          type: string
          nullable: true
        explanationStatus:
          type: string
          enum: [unverified_model_text, unavailable]
        explanationError:
          $ref: '#/components/schemas/ApiError'
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Неотрицательная десятичная сумма в RUB, без разделителей тысяч
      example: '2160.00'
    Work:
      type: string
      enum: [floor, paint, wallpaper, electrical]
    ProductKind:
      type: string
      enum: [covering, paint, primer, wallpaper, adhesive, socket, cable]
    Room:
      type: object
      description: |
        Геометрия: площадь пола length × width, стены 2 × (length + width) × height − openings.
        Дополнительные проверки backend: openings строго меньше полной площади стен;
        paint и wallpaper не могут одновременно отделывать всю одну поверхность.
        Условия влажности, нагрузки и отопления задаются явно, тип комнаты их не подменяет.
      required:
        - id
        - name
        - type
        - length
        - width
        - height
        - openings
        - humidity
        - load
        - heated
        - works
        - reserve
        - layers
        - sockets
        - cableLength
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          type: string
          enum: [living, bathroom, kitchen, children, balcony]
        length:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Длина, м
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Ширина, м
        height:
          type: number
          minimum: 1
          maximum: 10
          description: Высота стен, м
        openings:
          type: number
          minimum: 0
          maximum: 2000
          description: Суммарная площадь окон и дверей, м²
        humidity:
          type: string
          enum: [normal, high]
        load:
          type: string
          enum: [normal, high]
        heated:
          type: boolean
        works:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Work'
        reserve:
          type: number
          minimum: 0
          maximum: 30
          description: Запас в процентах, не множитель
        layers:
          type: integer
          minimum: 1
          maximum: 4
          description: Число слоёв краски
        sockets:
          type: integer
          minimum: 0
          maximum: 200
          description: Явно заданное число точек электрики
        cableLength:
          type: number
          minimum: 0
          maximum: 5000
          description: Явно заданная длина кабельных трасс, м
    Project:
      type: object
      required: [object, renovation, rooms]
      properties:
        object:
          type: string
          enum: [apartment, house, studio]
        renovation:
          type: string
          enum: [cosmetic, capital, designer]
        rooms:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Room'
    EstimateRequest:
      type: object
      required: [project, selections]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        selections:
          type: object
          description: Ключ roomId:productKind → нормализованный productId
          additionalProperties:
            type: string
          example:
            room-1:covering: normalized-product-1
    RecommendationsRequest:
      type: object
      required: [room]
      properties:
        room:
          $ref: '#/components/schemas/Room'
    ProductInput:
      type: object
      required: [area, perimeter, height, reserve, layers, quantity]
      properties:
        area:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
          description: Площадь обрабатываемой поверхности, м²
        perimeter:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: Периметр стен для обоев, м
        height:
          type: number
          minimum: 1
          maximum: 10
          description: Высота стен для обоев, м
        reserve:
          type: number
          minimum: 0
          maximum: 30
          description: Пользовательский запас в процентах для материалов; к числу розеток не применяется
        layers:
          type: integer
          minimum: 1
          maximum: 4
          description: Число слоёв применяется только к краске; грунтовка и клей рассчитываются за один цикл профиля
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 5000
          description: Для розеток — целое число электроточек без процентного запаса; для кабеля — длина трассы в метрах с запасом из профиля
    Product:
      type: object
      required:
        - id
        - name
        - category
        - kind
        - price
        - packageSize
        - unit
        - saleUnit
        - works
        - wet
        - highLoad
        - unheated
        - description
        - source
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        kind:
          $ref: '#/components/schemas/ProductKind'
        price:
          $ref: '#/components/schemas/Money'
        packageSize:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Количество unit в одной saleUnit; null — неизвестно. У обоев packageSize=null:
            число целых полотен из рулона рассчитывается по его геометрии, высоте, раппорту и подрезке профиля.
        unit:
          type: string
          description: Единица потребности и остатка, например м², л, кг, м, шт. или полотна
        saleUnit:
          type: string
          description: Единица продажи, например упаковка, банка или рулон; price относится к ней
        works:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        wet:
          type: boolean
          nullable: true
          description: Подтверждённая влагостойкость; null — неизвестно
        highLoad:
          type: boolean
          nullable: true
        unheated:
          type: boolean
          nullable: true
        description:
          type: string
          description: Plain text, не HTML
        source:
          type: string
          description: Источник характеристик и норм, версия
        consumption:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Справочная норма каталога в unit/м². Применяемую норму задаёт версионированный профиль правил с источником:
            для краски — на один слой, для грунтовки и клея — на один цикл. Противоречие норм требует уточнения.
        rollWidth:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Ширина рулона обоев, м
        rollLength:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Длина рулона обоев, м
        rapport:
          type: number
          minimum: 0
          description: Раппорт, м; 0 — без подгона
      example:
        id: normalized-product-1
        name: Керамогранит, условный пример
        category: Плитка
        kind: covering
        price: '2160.00'
        packageSize: 1.44
        unit: м²
        saleUnit: уп.
        works: [floor]
        wet: true
        highLoad: true
        unheated: true
        description: Иллюстрация структуры, не подтверждённый SKU или актуальная цена
        source: illustrative-example
    EstimateLine:
      type: object
      required:
        - id
        - roomId
        - roomName
        - product
        - quantity
        - need
        - purchased
        - remainder
        - total
        - formula
        - reason
      properties:
        id:
          type: string
        roomId:
          type: string
        roomName:
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
          description: >-
            Целое число единиц продажи в безопасном целочисленном диапазоне JavaScript, не более 9007199254740991.
            Если число упаковок выходит за поддерживаемый диапазон, backend возвращает 422.
        need:
          type: number
          minimum: 0
          description: Потребность согласно профилю в product.unit; для розеток без запаса, для обоев в целых полотнах. Промежуточного округления физических величин нет.
        purchased:
          type: number
          minimum: 0
          description: Фактически купленное количество, в product.unit
        remainder:
          type: number
          minimum: 0
          description: purchased − need, в product.unit
        total:
          $ref: '#/components/schemas/Money'
        formula:
          type: string
          description: Проверяемая формула, коэффициенты и единицы
        reason:
          type: string
          description: Причина применения коэффициента и источник нормы
    Versions:
      type: object
      required: [catalog, rules, model]
      properties:
        catalog:
          type: string
        rules:
          type: string
        model:
          type: string
    Estimate:
      type: object
      description: Материалы и ориентировочные работы раздельно; backend отвечает за согласованность итогов.
      required: [id, createdAt, mode, lines, materials, labor, total, warnings, versions]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: ISO 8601 UTC, с суффиксом Z
        mode:
          type: string
          enum: [api, demo]
          description: Backend возвращает api; demo зарезервировано для учебного адаптера
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EstimateLine'
        materials:
          $ref: '#/components/schemas/Money'
        labor:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
        versions:
          $ref: '#/components/schemas/Versions'
    ProductEstimate:
      allOf:
        - $ref: '#/components/schemas/Estimate'
        - type: object
          properties:
            lines:
              type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/EstimateLine'
            labor:
              type: string
              enum: ['0.00']
    Recommendation:
      type: object
      required: [product, reason]
      properties:
        product:
          $ref: '#/components/schemas/Product'
        reason:
          type: string
    Recommendations:
      type: object
      required: [products, warnings]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        warnings:
          type: array
          items:
            type: string
    ApiError:
      type: object
      description: Предлагаемая схема ошибки; текущий frontend показывает HTTP-статус, не рендерит тело.
      required: [code, message]
      properties:
        code:
          type: string
          example: needs_clarification
        message:
          type: string
        fields:
          type: array
          description: Пути полей, требующих уточнения
          items:
            type: string
      example:
        code: needs_clarification
        message: Не подтверждена норма расхода
        fields: [consumption]
  responses:
    Estimate:
      description: Смета материалов и работ с формулами и источниками
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Estimate'
    NeedsClarification:
      description: Неверный ввод или недостаточно подтверждённых данных для расчёта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Устаревшие данные или выбранный товар больше не доступен/не совместим
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: API, каталог или расчётный компонент пока не готовы
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error:
      description: Ошибка API; frontend не переключается на фикстуры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
