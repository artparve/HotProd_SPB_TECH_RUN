openapi: 3.0.3
info:
  title: RepairCalc Frontend API
  version: 1.0.0
  description: Java — публичный API, MongoDB — версионированные данные, Python — внутренний сервис LLM. Денежные
    суммы передаются десятичными строками RUB. Подборка интерьеров Pexels/Pinterest импортируется из локального manifest; пустая лента
    допустима. При недоступности зависимостей чтение возвращает типизированные пустые результаты с признаком деградации;
    расчёт и запись возвращают явные ошибки. Учебные данные не являются коммерческим предложением.
servers:
- url: /api/v1
  description: Same-origin API через Vite или nginx proxy
tags:
- name: Admin
- name: Catalog
- name: Estimates
- name: Recommendations
- name: RoomInspirations
paths:
  /room-inspirations:
    get:
      operationId: listRoomInspirations
      tags:
      - RoomInspirations
      summary: Получить ленту интерьеров для карточки комнаты
      description: Локальная подготовленная подборка с устойчивой cursor-пагинацией по ID. Пустой items допустим.
        При недоступности Mongo status=unavailable и warnings объясняют пустой результат.
      parameters:
      - name: roomType
        in: query
        required: false
        description: Тип комнаты. Для living доступны гостиные и спальни; для остальных типов — фотографии соответствующей категории, включая детские и балконы.
        schema:
          type: string
          enum: [living, bathroom, kitchen, children, balcony]
      - name: cursor
        in: query
        required: false
        description: Непрозрачный nextCursor предыдущей страницы; не номер страницы
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 24
          default: 24
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInspirationFeed'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
        '422':
          description: Недействительный или истёкший cursor; тело ApiError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /room-inspirations/{id}/analyze:
    post:
      operationId: analyzeRoomInspiration
      tags:
      - RoomInspirations
      summary: Выделить материалы интерьера и подготовить ввод калькулятора
      description: Java загружает изображение только по ID из импортированной подборки, Python извлекает тип отделки,
        тип интерьера должен соответствовать типу комнаты, иначе возвращается HTTP 422.
        Java сопоставляет его с совместимым каталогом. Если для условий комнаты нет покрытия распознанного типа,
        Java предлагает совместимое напольное покрытие по приоритету правил и указывает замену в warnings.
        Аналогично подбирается совместимая отделка стен, если распознанный вид отделки недоступен.
        Геометрия и условия комнаты сохраняются. status=ok предлагает
        selections; no_matches/unavailable возвращает selections={} и исходный project. Размеры, цены и нормы не
        определяются моделью.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInspirationRequest'
      responses:
        '200':
          description: Проверяемый подбор для калькулятора; требует просмотра пользователем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInspirationResult'
        '404':
          description: Изображение удалено или не принадлежит ленте; тело ApiError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /plans/extract:
    post:
      operationId: extractRoomPlan
      tags:
      - Estimates
      summary: Извлечь черновик параметров одной комнаты из изображения через Ollama
      description: 'Python estimator. JSON с imageBase64, до 12 MiB тела, до 8 MiB файла,

        до 12 млн пикселей; PNG/JPEG/WebP проверяются по содержимому.

        Один вызов Gemma (socket timeout по умолчанию 600 с). Общая блокировка

        с materials/estimate; занятый сервис возвращает 503 model_busy.

        Результат требует подтверждения. Координаты относительно изображения после

        EXIF-ориентации. Размеры нормализованы в метры, неизвестное остаётся null.

        dimensionsMetres.length/width=null для неподдерживаемой формы/нескольких комнат.

        Площадь, периметр и нулевая площадь проёмов автоматически не назначаются.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./room-plan-api.json#/components/schemas/PlanExtractRequest
      responses:
        '200':
          description: Черновик модели, единицы, координаты и сведения о воспроизводимости
          content:
            application/json:
              schema:
                $ref: ./room-plan-api.json#/components/schemas/PlanExtractResult
        '400':
          description: Некорректный JSON или Content-Length
        '413':
          description: Превышен размер тела, файла, подготовленного PNG или число пикселей
        '415':
          description: Неподдерживаемый Content-Type или формат изображения
        '422':
          description: Некорректный запрос, base64 или повреждённое изображение
        '502':
          description: Незавершённый ответ модели, нарушение схемы, единиц или границ
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /admin/session:
    $ref: ./admin-catalog-api.json#/paths/~1session
  /admin/login:
    $ref: ./admin-catalog-api.json#/paths/~1login
  /admin/logout:
    $ref: ./admin-catalog-api.json#/paths/~1logout
  /admin/products:
    $ref: ./admin-catalog-api.json#/paths/~1products
  /admin/products/{id}:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}
  /admin/products/{id}/history:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}~1history
  /admin/products/{id}/classifications:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}~1classifications
  /admin/products/{id}/reviews:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}~1reviews
  /admin/products/{id}/readiness:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}~1readiness
  /admin/products/{id}/publish:
    $ref: ./admin-catalog-api.json#/paths/~1products~1{id}~1publish
  /admin/review-options:
    $ref: ./admin-catalog-api.json#/paths/~1review-options
  /products:
    get:
      operationId: listProducts
      tags:
      - Catalog
      summary: Получить нормализованную витрину товаров для виджета
      description: Не сырой каталог и не все SKU магазина. Пустой список допустим.
      responses:
        '200':
          description: Товары витрины
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          headers:
            X-RepairCalc-Degraded:
              description: catalog_unavailable при недоступности каталога; тело остаётся [].
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /estimate:
    post:
      operationId: createEstimate
      tags:
      - Estimates
      summary: Рассчитать материалы и ориентировочные работы по проекту
      description: Реализовано Java на одной согласованной паре каталога и правил. Все данные учебные. Неизвестные,
        несовместимые и неиспользованные selections возвращают 409; отсутствие обязательных данных — 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
            example:
              project:
                object: apartment
                renovation: capital
                rooms:
                - id: room-1
                  name: Санузел
                  type: bathroom
                  length: 3
                  width: 2
                  height: 2.7
                  openings: 2
                  humidity: high
                  load: normal
                  heated: true
                  works:
                  - floor
                  - paint
                  reserve: 10
                  layers: 2
                  sockets: 2
                  cableLength: 12
              selections: {}
      responses:
        '200':
          $ref: '#/components/responses/Estimate'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /material-recommendations:
    post:
      operationId: recommendMaterialsWithEvidence
      tags:
      - Recommendations
      summary: Подбор материалов по проверенным источникам с необязательным объяснением Ollama
      description: Локальный BM25 baseline. При отсутствии актуальной опубликованной базы знаний кандидаты имеют compatibility=unknown.
        explain=true вызывает локальный LLM-шлюз только при наличии подтверждённых кандидатов. Модельный текст всегда непроверенный;
        ошибка модели не меняет результаты проверок. Геометрия необязательна для поиска; room необходим для последующего применения
        выбора.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRecommendationRequest'
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRecommendations'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /material-recommendations/{id}/estimate:
    post:
      operationId: applyMaterialRecommendations
      tags:
      - Estimates
      summary: Применить явно выбранные подтверждённые товары к расчёту одной комнаты
      description: Сервер хранит исходный подбор один час. Повторно проверяет комнату, условия, каталог, правила, базу знаний,
        товары и связки. Все строки требуют явного выбора. Автоматическая замена запрещена. 409 stale_recommendation требует
        нового подбора; 422 сообщает о недостающем выборе или неподтверждённой связке.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project
              - selections
              properties:
                project:
                  $ref: '#/components/schemas/Project'
                selections:
                  type: object
                  maxProperties: 7
                  additionalProperties:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/Estimate'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /material-recommendations/{id}/preview:
    post:
      operationId: previewMaterialRecommendations
      tags: [Estimates]
      summary: Предварительный расчёт явно выбранных товаров без подтверждения применимости
      description: Требуются явное согласие acceptUnverified=true, исходная комната и выбор всех строк. Проверяются серверный список кандидатов, часовой срок, версии каталога и правил. База знаний не считается подтверждённой. Для пояснения Java повторно проверяет и рассчитывает те же выбранные товары; текст модели не изменяет смету.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialPreviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/Estimate'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /material-recommendations/{id}/preview/explanation:
    post:
      operationId: explainMaterialPreview
      tags: [Estimates]
      summary: Пояснение модели к предварительной Java-смете
      description: Требуются явное согласие acceptUnverified=true, исходная комната и выбор всех строк. Проверяются серверный список кандидатов, часовой срок, версии каталога и правил. База знаний не считается подтверждённой. Для пояснения Java повторно проверяет и рассчитывает те же выбранные товары; текст модели не изменяет смету.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialPreviewRequest'
      responses:
        '200':
          description: Непроверенное пояснение или unavailable; Java-смета остаётся действительной
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateExplanation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /admin/knowledge-releases:
    post:
      operationId: publishKnowledge
      tags:
      - Admin
      summary: Явная административная публикация проверенной базы знаний
      description: Требуются существующая admin-сессия и X-CSRF-Token. Права и технические факты проверяет человек до отправки.
        Точные ID версий товаров имеют вид catalogReleaseId:productId. Требования ссылаются только на существующие категории
        kits. Нельзя использовать черновые источники. Полный корпус сохраняется неизменно; указатель переключается атомарно,
        старые версии сохраняются.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBundle'
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRelease'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /admin/knowledge-releases/{id}/activate:
    post:
      operationId: activateKnowledgeRelease
      tags:
      - Admin
      summary: Активировать сохранённую версию базы знаний
      description: Требуются admin-сессия и CSRF. Отозванная версия не может быть активирована. При откате повторно проверяются
        версии каталога/правил и сроки источников.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Результат операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeRelease'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /admin/knowledge-releases/{id}/revoke:
    post:
      operationId: revokeKnowledgeRelease
      tags:
      - Admin
      summary: Отозвать базу знаний
      description: Требуются admin-сессия и CSRF. Отозванная версия не может быть активирована. При откате повторно проверяются
        версии каталога/правил и сроки источников.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Версия отозвана
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /recommendations:
    post:
      operationId: recommendProducts
      tags:
      - Recommendations
      summary: Подобрать товары по условиям комнаты с объяснениями
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationsRequest'
      responses:
        '200':
          description: Подходящие товары и ограничения; пустой список допустим
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendations'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
      description: Реализовано Java на одной согласованной паре каталога и правил. Все данные учебные. При недоступности
        Mongo возвращаются пустые products и предупреждение.
  /product/{id}/calc:
    post:
      operationId: calculateProduct
      tags:
      - Estimates
      summary: Рассчитать потребность и целые упаковки одного товара
      description: 'Возвращает Estimate с одной строкой и labor = "0.00".

        Для покрытий/красок/смесей area означает площадь обрабатываемой поверхности.

        Обои используют perimeter и height, розетки/кабель — quantity в единице товара.

        Применяемые нормы, подрезка, запас и слои определяются версионированным профилем правил с источником.

        Все поля обязательны и проверяются по своим ограничениям; поля вне выбранной стратегии не участвуют в арифметике.

        Текущий подготовленный набор использует явно помеченные учебные данные, не нормы производителя.

        Для клея поддержан только тестовый профиль 4 кг/м² для условно ровного основания;

        толщина слоя, технология и пригодность материала для объекта этим запросом не проверяются.

        Для обоев приняты подрезка 0,10 м, подгон длины по известному раппорту и запас до округления полотен;

        проёмы не вычитаются. Неизвестный раппорт не считается нулевым.

        '
      parameters:
      - name: id
        in: path
        required: true
        description: Нормализованный ID товара, не произвольно выбранный JSON/XML ID
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              area: 20
              perimeter: 18
              height: 2.7
              reserve: 10
              layers: 2
              quantity: 6
      responses:
        '200':
          description: Расчёт одного товара без стоимости работ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEstimate'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /materials/estimate:
    post:
      operationId: estimateMaterialWithAssistant
      tags:
      - Estimates
      summary: Расчёт товара через Ollama tool calling и пояснение модели
      description: Публичный маршрут Java. Сначала выполняется достоверный расчёт Java; при estimate Python получает
        только этот снимок для объяснения. Отсутствие модели не меняет расчёт. useCorrection=true возвращает 422,
        пока не настроен подтверждённый коэффициент.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
      responses:
        '200':
          description: Проверенная Java-смета и отдельно справочное пояснение модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialEstimate'
        '422':
          $ref: '#/components/responses/NeedsClarification'
        '502':
          description: Модель не выполнила обязательный вызов tool или ответ некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /materials/calculate:
    post:
      operationId: calculateMaterialWithoutAssistant
      tags:
      - Estimates
      summary: Детерминированный расчёт через Python-сервис без вызова Ollama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
      responses:
        '200':
          description: Java-смета, baseline и сведения о поправке без пояснения модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCalculation'
        default:
          $ref: '#/components/responses/Error'
      description: Публичный маршрут Java. Сначала выполняется достоверный расчёт Java; при estimate Python получает
        только этот снимок для объяснения. Отсутствие модели не меняет расчёт. useCorrection=true возвращает 422,
        пока не настроен подтверждённый коэффициент.
  /room-inspirations/{id}/image:
    get:
      operationId: getRoomInspirationImage
      tags:
      - RoomInspirations
      summary: Получить подготовленное изображение
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Проверенный локальный файл
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
  /room-inspirations/{id}/thumbnail:
    get:
      operationId: getRoomInspirationThumbnail
      tags:
      - RoomInspirations
      summary: Получить PNG-превью
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Проверенный локальный файл
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    AdminCookie:
      $ref: ./admin-catalog-api.json#/components/securitySchemes/AdminCookie
    AdminCsrf:
      $ref: ./admin-catalog-api.json#/components/securitySchemes/AdminCsrf
  schemas:
    MaterialPreviewRequest:
      type: object
      required: [project, selections, acceptUnverified]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        selections:
          type: object
          maxProperties: 7
          additionalProperties:
            type: string
        acceptUnverified:
          type: boolean
          enum: [true]
    EstimateExplanation:
      type: object
      required: [status, model, explanation]
      properties:
        status:
          type: string
          enum: [unverified_model_text, unavailable]
        model:
          type: string
          nullable: true
        explanation:
          type: string
          nullable: true
          maxLength: 6000
    RoomInspiration:
      type: object
      required:
      - id
      - title
      - description
      - thumbnailUrl
      - imageUrl
      - alt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          example: living-warm-01
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Тёплая гостиная
        description:
          type: string
          maxLength: 1000
        thumbnailUrl:
          $ref: '#/components/schemas/InspirationImageUrl'
        imageUrl:
          $ref: '#/components/schemas/InspirationImageUrl'
        alt:
          type: string
          minLength: 1
          maxLength: 300
          example: Гостиная с зелёным диваном и деревянным полом
        category:
          type: string
          enum: [living, bedroom, kitchen, bathroom, children, balcony, other]
          description: Категория сюжета фотографии; не меняет тип или условия исходной комнаты.
        sourceUrl:
          type: string
          format: uri
          pattern: ^https://
          description: HTTPS-ссылка на исходную страницу фотографии Pexels или Pinterest pin; файлы выдаются локально.
    InspirationImageUrl:
      type: string
      maxLength: 2048
      pattern: ^/(?!/)[^\s\\#]*$
      description: Абсолютный путь на текущем origin; внешние URL и обратные слеши запрещены
      example: /api/v1/room-inspirations/living-warm-01/image
    RoomInspirationFeed:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/RoomInspiration'
        nextCursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        status:
          type: string
          enum:
          - ok
          - unavailable
          default: ok
        warnings:
          type: array
          items:
            type: string
          default: []
    RoomInspirationRequest:
      type: object
      required:
      - project
      properties:
        project:
          $ref: '#/components/schemas/InspirationProject'
    InspirationProject:
      description: Контекст ровно одной комнаты — отдельной или активной в общем расчёте
      allOf:
      - $ref: '#/components/schemas/Project'
      - type: object
        properties:
          rooms:
            type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/components/schemas/Room'
    RoomInspirationResult:
      type: object
      required:
      - imageId
      - project
      - selections
      - warnings
      description: 'status=ok: 1–7 совместимых selections. no_matches/unavailable: selections={}, исходный project
        сохраняется. Отсутствующий status трактуется как ok для совместимости.'
      properties:
        imageId:
          type: string
          minLength: 1
          maxLength: 128
        project:
          $ref: '#/components/schemas/InspirationProject'
        selections:
          type: object
          minProperties: 0
          maxProperties: 7
          description: Явно выбранные материалы; не могут молча заменяться при расчёте
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          example:
            room-1:covering: product-laminate-01
            room-1:paint: product-paint-01
        warnings:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 1000
          example:
          - Размеры взяты из проекта; проверьте их перед окончательным расчётом.
          - Мебель и декор на изображении не входят в подбор материалов.
        status:
          type: string
          enum:
          - ok
          - no_matches
          - unavailable
          default: ok
      oneOf:
      - properties:
          status:
            enum:
            - ok
          selections:
            minProperties: 1
      - required:
        - status
        properties:
          status:
            enum:
            - no_matches
            - unavailable
          selections:
            maxProperties: 0
    MaterialRequest:
      type: object
      required:
      - productId
      - input
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        input:
          $ref: '#/components/schemas/ProductInput'
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
        useCorrection:
          type: boolean
          default: false
    MaterialCorrection:
      type: object
      required:
      - applied
      - version
      - factor
      properties:
        applied:
          type: boolean
        version:
          type: string
        factor:
          type: string
          pattern: ^\d+(\.\d+)?$
        originalReserve:
          type: string
        effectiveReserve:
          type: string
    MaterialCalculation:
      type: object
      required:
      - status
      - estimate
      - baseline
      - correction
      - model
      properties:
        status:
          type: string
          enum:
          - ok
        estimate:
          $ref: '#/components/schemas/ProductEstimate'
        baseline:
          $ref: '#/components/schemas/ProductEstimate'
        correction:
          $ref: '#/components/schemas/MaterialCorrection'
        model:
          type: string
    MaterialEstimate:
      type: object
      required:
      - status
      - estimate
      - baseline
      - correction
      - model
      - toolCalls
      - explanation
      - explanationStatus
      properties:
        status:
          type: string
          enum:
          - ok
        estimate:
          $ref: '#/components/schemas/ProductEstimate'
        baseline:
          $ref: '#/components/schemas/ProductEstimate'
        correction:
          $ref: '#/components/schemas/MaterialCorrection'
        model:
          type: string
          minLength: 1
        toolCalls:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            enum:
            - calculate_material_cost
        explanation:
          type: string
          nullable: true
          description: 'Пояснение модели в Markdown. Frontend поддерживает заголовки, списки, таблицы,

            выделение, цитаты и код. Сырой HTML не исполняется, изображения не загружаются,

            ссылки ограничены безопасными протоколами. Не источник расчётных сумм.

            '
        explanationStatus:
          type: string
          enum:
          - unverified_model_text
          - unavailable
        explanationError:
          $ref: '#/components/schemas/ApiError'
      description: Проверенная смета Java сохраняется при сбое любой стадии объяснения. При explanationStatus=unavailable
        разрешены model=not-used и toolCalls=[]. Текст модели не заменяет суммы.
    Money:
      type: string
      pattern: ^\d+(\.\d{1,2})?$
      description: Неотрицательная десятичная сумма в RUB, без разделителей тысяч
      example: '2160.00'
    Work:
      type: string
      enum:
      - floor
      - paint
      - wallpaper
      - electrical
    ProductKind:
      type: string
      enum:
      - covering
      - paint
      - primer
      - wallpaper
      - adhesive
      - socket
      - cable
    Room:
      type: object
      description: 'Геометрия: площадь пола length × width, стены 2 × (length + width) × height − openings.

        Дополнительные проверки backend: openings строго меньше полной площади стен;

        paint и wallpaper не могут одновременно отделывать всю одну поверхность.

        Условия влажности, нагрузки и отопления задаются явно, тип комнаты их не подменяет.

        '
      required:
      - id
      - name
      - type
      - length
      - width
      - height
      - openings
      - humidity
      - load
      - heated
      - works
      - reserve
      - layers
      - sockets
      - cableLength
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          type: string
          enum:
          - living
          - bathroom
          - kitchen
          - children
          - balcony
        length:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Длина, м
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Ширина, м
        height:
          type: number
          minimum: 1
          maximum: 10
          description: Высота стен, м
        openings:
          type: number
          minimum: 0
          maximum: 2000
          description: Суммарная площадь окон и дверей, м²
        humidity:
          type: string
          enum:
          - normal
          - high
        load:
          type: string
          enum:
          - normal
          - high
        heated:
          type: boolean
        works:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Work'
        reserve:
          type: number
          minimum: 0
          maximum: 30
          description: Запас в процентах, не множитель
        layers:
          type: integer
          minimum: 1
          maximum: 4
          description: Число слоёв краски
        sockets:
          type: integer
          minimum: 0
          maximum: 200
          description: Явно заданное число точек электрики
        cableLength:
          type: number
          minimum: 0
          maximum: 5000
          description: Явно заданная длина кабельных трасс, м
    Project:
      type: object
      required:
      - object
      - renovation
      - rooms
      properties:
        object:
          type: string
          enum:
          - apartment
          - house
          - studio
        renovation:
          type: string
          enum:
          - cosmetic
          - capital
          - designer
        rooms:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Room'
    EstimateRequest:
      type: object
      required:
      - project
      - selections
      properties:
        project:
          $ref: '#/components/schemas/Project'
        selections:
          type: object
          description: Ключ roomId:productKind → нормализованный productId
          additionalProperties:
            type: string
          example:
            room-1:covering: normalized-product-1
    RecommendationsRequest:
      type: object
      required:
      - room
      properties:
        room:
          $ref: '#/components/schemas/Room'
    ProductInput:
      type: object
      required:
      - area
      - perimeter
      - height
      - reserve
      - layers
      - quantity
      properties:
        area:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
          description: Площадь обрабатываемой поверхности, м²
        perimeter:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: Периметр стен для обоев, м
        height:
          type: number
          minimum: 1
          maximum: 10
          description: Высота стен для обоев, м
        reserve:
          type: number
          minimum: 0
          maximum: 30
          description: Пользовательский запас в процентах для материалов; к числу розеток не применяется
        layers:
          type: integer
          minimum: 1
          maximum: 4
          description: Число слоёв применяется только к краске; грунтовка и клей рассчитываются за один цикл профиля
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 5000
          description: Для розеток — целое число электроточек без процентного запаса; для кабеля — длина трассы
            в метрах с запасом из профиля
    Product:
      type: object
      required:
      - id
      - name
      - category
      - kind
      - price
      - packageSize
      - unit
      - saleUnit
      - works
      - wet
      - highLoad
      - unheated
      - description
      - source
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        kind:
          $ref: '#/components/schemas/ProductKind'
        price:
          $ref: '#/components/schemas/Money'
        packageSize:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: 'Количество unit в одной saleUnit; null — неизвестно. У обоев packageSize=null: число целых
            полотен из рулона рассчитывается по его геометрии, высоте, раппорту и подрезке профиля.'
        unit:
          type: string
          description: Единица потребности и остатка, например м², л, кг, м, шт. или полотна
        saleUnit:
          type: string
          description: Единица продажи, например упаковка, банка или рулон; price относится к ней
        works:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        wet:
          type: boolean
          nullable: true
          description: Подтверждённая влагостойкость; null — неизвестно
        highLoad:
          type: boolean
          nullable: true
        unheated:
          type: boolean
          nullable: true
        description:
          type: string
          description: Plain text, не HTML
        source:
          type: string
          description: Источник характеристик и норм, версия
        consumption:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: 'Справочная норма каталога в unit/м². Применяемую норму задаёт версионированный профиль правил
            с источником: для краски — на один слой, для грунтовки и клея — на один цикл. Противоречие норм требует
            уточнения.'
        rollWidth:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Ширина рулона обоев, м
        rollLength:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Длина рулона обоев, м
        rapport:
          type: number
          minimum: 0
          description: Раппорт, м; 0 — без подгона
        materialFamily:
          type: string
          enum:
          - tile
          - laminate
          - vinyl
          nullable: true
          description: Подтверждённое семейство напольного покрытия; не выводится из названия.
      example:
        id: normalized-product-1
        name: Керамогранит, условный пример
        category: Плитка
        kind: covering
        price: '2160.00'
        packageSize: 1.44
        unit: м²
        saleUnit: уп.
        works:
        - floor
        wet: true
        highLoad: true
        unheated: true
        description: Иллюстрация структуры, не подтверждённый SKU или актуальная цена
        source: illustrative-example
    EstimateLine:
      type: object
      required:
      - id
      - roomId
      - roomName
      - product
      - quantity
      - need
      - purchased
      - remainder
      - total
      - formula
      - reason
      properties:
        id:
          type: string
        roomId:
          type: string
        roomName:
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
          description: Целое число единиц продажи в безопасном целочисленном диапазоне JavaScript, не более 9007199254740991.
            Если число упаковок выходит за поддерживаемый диапазон, backend возвращает 422.
        need:
          type: number
          minimum: 0
          description: Потребность согласно профилю в product.unit; для розеток без запаса, для обоев в целых полотнах.
            Промежуточного округления физических величин нет.
        purchased:
          type: number
          minimum: 0
          description: Фактически купленное количество, в product.unit
        remainder:
          type: number
          minimum: 0
          description: purchased − need, в product.unit
        total:
          $ref: '#/components/schemas/Money'
        formula:
          type: string
          description: Проверяемая формула, коэффициенты и единицы
        reason:
          type: string
          description: Причина применения коэффициента и источник нормы
    Versions:
      type: object
      required:
      - catalog
      - rules
      - model
      properties:
        catalog:
          type: string
        rules:
          type: string
        model:
          type: string
    Estimate:
      type: object
      description: Материалы и ориентировочные работы раздельно; backend отвечает за согласованность итогов.
      required:
      - id
      - createdAt
      - mode
      - lines
      - materials
      - labor
      - total
      - warnings
      - versions
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: Z$
          description: ISO 8601 UTC, с суффиксом Z
        mode:
          type: string
          enum:
          - api
          - demo
          description: Backend возвращает api; demo зарезервировано для учебного адаптера
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EstimateLine'
        materials:
          $ref: '#/components/schemas/Money'
        labor:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
        versions:
          $ref: '#/components/schemas/Versions'
    ProductEstimate:
      allOf:
      - $ref: '#/components/schemas/Estimate'
      - type: object
        properties:
          lines:
            type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/components/schemas/EstimateLine'
          labor:
            type: string
            enum:
            - '0.00'
    Recommendation:
      type: object
      required:
      - product
      - reason
      properties:
        product:
          $ref: '#/components/schemas/Product'
        reason:
          type: string
    Recommendations:
      type: object
      required:
      - products
      - warnings
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        warnings:
          type: array
          items:
            type: string
    ApiError:
      type: object
      description: Предлагаемая схема ошибки; текущий frontend показывает HTTP-статус, не рендерит тело.
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: needs_clarification
        message:
          type: string
        fields:
          type: array
          description: Пути полей, требующих уточнения
          items:
            type: string
      example:
        code: needs_clarification
        message: Не подтверждена норма расхода
        fields:
        - consumption
    MaterialConditions:
      type: object
      required:
      - humidity
      - load
      - heated
      properties:
        humidity:
          type: string
          enum:
          - normal
          - high
          nullable: true
        load:
          type: string
          enum:
          - normal
          - high
          nullable: true
        heated:
          type: boolean
          nullable: true
        substrate:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        waterContact:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        covering:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        baseState:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        floorHeating:
          type: boolean
          nullable: true
    MaterialRecommendationRequest:
      type: object
      required:
      - works
      properties:
        works:
          type: array
          items:
            type: string
            enum:
            - floor
            - paint
            - wallpaper
            - electrical
          minItems: 1
          maxItems: 4
        conditions:
          $ref: '#/components/schemas/MaterialConditions'
        query:
          type: string
          maxLength: 500
          nullable: true
        room:
          $ref: '#/components/schemas/Room'
        designPreferences:
          type: string
          maxLength: 500
          nullable: true
        explain:
          type: boolean
          default: false
        renovation:
          type: string
          enum:
          - cosmetic
          - capital
          - designer
        object:
          type: string
          enum:
          - apartment
          - house
          - studio
        referenceSearch:
          type: boolean
          default: false
          description: Явный запрос исследовательских PDF; требует серверного RAG_REFERENCE_SEARCH_ENABLED=true. Не подтверждает
            SKU.
    MaterialCandidate:
      type: object
      required:
      - productId
      - productVersionId
      - name
      - compatibility
      - calculationReadiness
      - reason
      - checks
      - sources
      properties:
        productId:
          type: string
          format: uuid
        productVersionId:
          type: string
        name:
          type: string
        compatibility:
          type: string
          enum:
          - pass
          - unknown
        calculationReadiness:
          type: string
          enum:
          - ready
          - unavailable
        reason:
          type: string
        checks:
          type: array
          items:
            type: object
            required:
            - property
            - status
            - reason
            properties:
              property:
                type: string
              status:
                type: string
                enum:
                - pass
                - fail
                - unknown
              reason:
                type: string
        sources:
          type: array
          items:
            type: object
            required:
            - chunkId
            - sourceId
            - title
            - url
            - version
            - sha256
            - section
            - text
            properties:
              chunkId:
                type: string
              sourceId:
                type: string
              title:
                type: string
              url:
                type: string
                format: uri
                pattern: ^https://
              version:
                type: string
              sha256:
                type: string
              section:
                type: string
              text:
                type: string
    MaterialRecommendations:
      type: object
      required:
      - requestId
      - status
      - catalogReleaseId
      - ruleSetId
      - knowledgeReleaseId
      - indexVersion
      - retrievalVersion
      - questions
      - categories
      - warnings
      - explanation
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ready
          - needs_clarification
          - partial
        catalogReleaseId:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        knowledgeReleaseId:
          type: string
          nullable: true
        indexVersion:
          type: string
          nullable: true
        retrievalVersion:
          type: string
          enum:
          - bm25-v1
        questions:
          type: array
          items:
            type: object
            required:
            - field
            - reason
            - options
            properties:
              field:
                type: string
              reason:
                type: string
              options:
                type: array
                items:
                  type: string
        categories:
          type: array
          items:
            type: object
            required:
            - work
            - kind
            - candidates
            properties:
              work:
                type: string
                enum:
                - floor
                - paint
                - wallpaper
                - electrical
              kind:
                type: string
              coveringFamily:
                type: string
                nullable: true
              candidates:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialCandidate'
        warnings:
          type: array
          items:
            type: string
        explanation:
          type: object
          required:
          - status
          - items
          properties:
            status:
              type: string
              enum:
              - deterministic
              - unverified_model_text
            model:
              type: string
              nullable: true
            fallbackReason:
              type: string
              nullable: true
            items:
              type: array
              items:
                type: object
                required:
                - productId
                - text
                - chunkIds
                properties:
                  productId:
                    type: string
                    format: uuid
                  text:
                    type: string
                    maxLength: 1500
                  chunkIds:
                    type: array
                    items:
                      type: string
        references:
          $ref: '#/components/schemas/ReferenceAnswer'
    KnowledgeSource:
      type: object
      required:
      - id
      - title
      - publisher
      - url
      - version
      - retrievedOn
      - validUntil
      - sha256
      - rightsStatus
      - reviewStatus
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        publisher:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 1000
        version:
          type: string
          minLength: 1
          maxLength: 100
        retrievedOn:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        rightsStatus:
          type: string
          enum:
          - approved
        reviewStatus:
          type: string
          enum:
          - confirmed
    KnowledgeChunk:
      type: object
      required:
      - id
      - productId
      - productVersionId
      - sourceId
      - section
      - text
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        productId:
          type: string
          format: uuid
        productVersionId:
          type: string
          minLength: 1
          maxLength: 100
        sourceId:
          type: string
          minLength: 1
          maxLength: 80
        section:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 1500
    KnowledgeClaim:
      type: object
      required:
      - productId
      - property
      - value
      - status
      - chunkIds
      properties:
        productId:
          type: string
          format: uuid
        property:
          type: string
          enum:
          - work
          - wet
          - highLoad
          - unheated
          - substrate
          - waterContact
          - floorHeating
          - covering
          - baseState
        value:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - confirmed
          - unknown
          - conflict
        chunkIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          minItems: 1
          maxItems: 10
    KnowledgeRequirement:
      type: object
      required:
      - work
      - kind
      - conditions
      properties:
        work:
          type: string
          enum:
          - floor
          - paint
          - wallpaper
          - electrical
        kind:
          type: string
          minLength: 1
          maxLength: 50
        conditions:
          type: array
          items:
            type: string
            enum:
            - humidity
            - load
            - heated
            - substrate
            - waterContact
            - floorHeating
            - covering
            - baseState
          minItems: 1
          maxItems: 8
    KnowledgeCombination:
      type: object
      required:
      - first
      - second
      - status
      - chunkIds
      properties:
        first:
          type: string
          format: uuid
        second:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pass
          - fail
          - unknown
        chunkIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          minItems: 1
          maxItems: 20
    KnowledgeBundle:
      type: object
      required:
      - catalogReleaseId
      - ruleSetId
      - sources
      - chunks
      - claims
      - requirements
      - combinations
      properties:
        catalogReleaseId:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
          minItems: 1
          maxItems: 100
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeChunk'
          minItems: 1
          maxItems: 500
        claims:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeClaim'
          minItems: 1
          maxItems: 500
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRequirement'
          minItems: 1
          maxItems: 30
        combinations:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeCombination'
          maxItems: 500
    KnowledgeRelease:
      type: object
      required:
      - id
      - bundle
      - checksum
      - retrievalVersion
      - publishedAt
      - reviewedBy
      - manifest
      properties:
        id:
          type: string
          format: uuid
        bundle:
          $ref: '#/components/schemas/KnowledgeBundle'
        checksum:
          type: string
        retrievalVersion:
          type: string
          enum:
          - bm25-v1
        publishedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        manifest:
          type: object
          required:
          - embeddingModel
          - dimension
          - normalizationVersion
          - chunkingVersion
          - documentCount
          - productCount
          properties:
            embeddingModel:
              type: string
              enum:
              - none
            dimension:
              type: integer
              enum:
              - 0
            normalizationVersion:
              type: string
              enum:
              - unicode-lower-yo-v1
            chunkingVersion:
              type: string
              enum:
              - operator-v1
            documentCount:
              type: integer
              minimum: 0
            productCount:
              type: integer
              minimum: 0
    ReferenceAnswer:
      type: object
      required:
      - status
      - indexId
      - corpusMode
      - usableForDecisions
      - fragments
      - items
      - model
      - fallbackReason
      properties:
        status:
          type: string
          enum:
          - disabled
          - unavailable
          - empty
          - deterministic
          - unverified_model_text
        indexId:
          type: string
          nullable: true
        corpusMode:
          type: string
          enum:
          - research_draft
        usableForDecisions:
          type: boolean
          enum:
          - false
        fragments:
          type: array
          items:
            type: object
            required:
            - chunkId
            - sourceId
            - title
            - publisher
            - url
            - sha256
            - version
            - versionNote
            - page
            - text
            - reviewStatus
            - rightsStatus
            - usableForDecisions
            properties:
              chunkId:
                type: string
              sourceId:
                type: string
              title:
                type: string
              publisher:
                type: string
              url:
                type: string
                format: uri
                nullable: true
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              version:
                type: string
              versionNote:
                type: string
              page:
                type: integer
                minimum: 1
              text:
                type: string
                maxLength: 1200
              reviewStatus:
                type: string
              rightsStatus:
                type: string
              usableForDecisions:
                type: boolean
                enum:
                - false
        items:
          type: array
          items:
            type: object
            required:
            - text
            - chunkIds
            properties:
              text:
                type: string
                maxLength: 1500
              chunkIds:
                type: array
                items:
                  type: string
        model:
          type: string
          nullable: true
        fallbackReason:
          type: string
          nullable: true
  responses:
    Estimate:
      description: Смета материалов и работ с формулами и источниками
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Estimate'
    NeedsClarification:
      description: Неверный ввод или недостаточно подтверждённых данных для расчёта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Устаревшие данные или выбранный товар больше не доступен/не совместим
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: API, каталог или расчётный компонент пока не готовы
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error:
      description: Ошибка API; frontend не переключается на фикстуры
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
