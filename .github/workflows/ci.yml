name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make init-config
      - run: npm --prefix frontend ci --no-fund
      - run: make check
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    # MongoDB 8.0 currently rejects kernels on the newer Ubuntu 24.04 runner images.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Docker host and Mongo image
        run: python scripts/mongo_runtime.py diagnose --report .build-mongo-environment-backend.json
      - name: Verify Mongo stability and replica-set transactions before Maven
        run: python scripts/mongo_runtime.py probe --report .build-mongo-compat-backend.json
      # GitHub hosted Linux runner supplies Docker for Testcontainers.
      - run: bash ./mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: java-test-failure
          include-hidden-files: true
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            .build-mongo-*.json
          retention-days: 7

  python-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docker/ansible/requirements.txt -r llm/requirements.txt
      - run: python -m unittest discover -s llm/estimation/tests
        env:
          PYTHONPATH: llm/estimation
      - run: python -m unittest discover -s llm/classification/tests
        env:
          PYTHONPATH: llm/classification
      - run: python -m unittest discover -s llm/tests
        env:
          PYTHONPATH: llm:llm/estimation:llm/classification
      - run: python -m unittest discover -s tests/release
      - run: ansible-playbook -i localhost, docker/ansible/deploy.yml --syntax-check
      - name: Validate release Compose without real credentials
        run: python -m scripts.github_actions validate-compose

  stack:
    needs: [frontend, backend, python-and-deploy]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Docker host before application builds
        run: python scripts/mongo_runtime.py diagnose --report .build-mongo-environment-stack.json
      - run: npm --prefix frontend ci --no-fund
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: python scripts/verify-stack.py --playwright
      - run: python scripts/verify-stack.py --base-only --no-build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-stack-failure
          include-hidden-files: true
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .build-mongo-*.json
          retention-days: 7

  images:
    if: github.event_name == 'push'
    needs: [stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            file: docker/frontend.Dockerfile
          - image: backend
            file: docker/backend.Dockerfile
          - image: llm
            file: docker/llm.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lowercase GHCR namespace
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 -m scripts.github_actions image-prefix
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          build-args: |
            MAVEN_IMAGE=${{ vars.MAVEN_IMAGE || 'maven:3.9-eclipse-temurin-21' }}
            JAVA_IMAGE=${{ vars.JAVA_IMAGE || 'eclipse-temurin:21-jre-jammy' }}
            NODE_IMAGE=${{ vars.NODE_IMAGE || 'node:22-alpine' }}
            NGINX_IMAGE=${{ vars.NGINX_IMAGE || 'nginx:1.28-alpine' }}
            PYTHON_IMAGE=${{ vars.PYTHON_IMAGE || 'python:3.12-slim' }}
            MAVEN_CENTRAL_URL=${{ vars.MAVEN_CENTRAL_URL || 'https://repo.maven.apache.org/maven2' }}
            VITE_API_TIMEOUT_MS=${{ vars.VITE_API_TIMEOUT_MS || '15000' }}
            VITE_LLM_TIMEOUT_MS=${{ vars.VITE_LLM_TIMEOUT_MS || '1260000' }}
            VITE_PLAN_TIMEOUT_MS=${{ vars.VITE_PLAN_TIMEOUT_MS || '660000' }}
            VITE_INSPIRATION_TIMEOUT_MS=${{ vars.VITE_INSPIRATION_TIMEOUT_MS || '120000' }}
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
