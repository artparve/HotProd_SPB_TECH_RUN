name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (configure secrets and approvals first)
        type: environment
        required: true
      commit_sha:
        description: Optional full SHA of a successful main CI run (defaults to latest main commit)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    # GitHub exposes selected Environment variables through the vars context.
    # Scripts receive normal process environment variables, never GitHub expressions.
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}
      REPOSITORY: ${{ github.repository }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_FRONTEND_HOST: ${{ vars.DEPLOY_FRONTEND_HOST || '0.0.0.0' }}
      DEPLOY_FRONTEND_PORT: ${{ vars.DEPLOY_FRONTEND_PORT || '8080' }}
      DB_NAME: ${{ vars.DB_NAME || 'repaircalc' }}
      DB_USER: ${{ vars.DB_USER || 'repaircalc' }}
      POSTGRES_IMAGE_TAG: ${{ vars.POSTGRES_IMAGE_TAG || '17.11' }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
      ADMIN_COOKIE_SECURE: ${{ vars.ADMIN_COOKIE_SECURE || 'true' }}
      ADMIN_SESSION_SECONDS: ${{ vars.ADMIN_SESSION_SECONDS || '1800' }}
      OLLAMA_URL: ${{ vars.OLLAMA_URL || 'http://ollama:11434' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:12b' }}
      OLLAMA_NUM_THREADS: ${{ vars.OLLAMA_NUM_THREADS || '8' }}
      OLLAMA_IMAGE_TAG: ${{ vars.OLLAMA_IMAGE_TAG || '0.40.13' }}
      OLLAMA_CPU_LIMIT: ${{ vars.OLLAMA_CPU_LIMIT || '8.0' }}
      OLLAMA_MEMORY_LIMIT: ${{ vars.OLLAMA_MEMORY_LIMIT || '12g' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow only a fully successful main CI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.github_actions check-release
      # Keep deployment fixes from the dispatch commit even when selecting older images.
      # RELEASE_SHA selects immutable image tags, not an older version of the deploy tooling.
      - run: python -m pip install -r ansible/requirements.txt
      - name: Deploy the selected release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: python -m scripts.github_actions deploy
