spring:
  autoconfigure:
    exclude: []
  datasource:
    # Connection details are supplied by the owned Testcontainers bean.
    password: unused-service-connection-password
    hikari:
      connection-timeout: 1000
      validation-timeout: 1000
      minimum-idle: 0
      maximum-pool-size: 2

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,calculationData,db
