spring:
  application:
    name: repaircalc-backend
  profiles:
    default: local
  mongodb:
    uri: ${MONGO_URI:mongodb://127.0.0.1:27017/repaircalc?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000}
  data:
    mongodb:
      auto-index-creation: false

server:
  port: ${SERVER_PORT:8000}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: REPAIRCALC_ADMIN
        path: /api/v1/admin
        http-only: true
        secure: ${ADMIN_COOKIE_SECURE:true}
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    level: '%5p [requestId=%X{requestId}]'

repaircalc:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    session-seconds: ${ADMIN_SESSION_SECONDS:1800}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,calculationData,mongo
