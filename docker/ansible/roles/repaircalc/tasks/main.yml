---
- name: Validate deployment parameters
  ansible.builtin.assert:
    that:
      - release_environment is match('^[a-z][a-z0-9-]{0,31}$')
      - release_image_tag is match('^sha-[0-9a-f]{40}$')
      - release_image_prefix is match('^ghcr[.]io/[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$')
      - release_id is match('^sha-[0-9a-f]{40}-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$')
      - release_frontend_port | int >= 1024
      - release_frontend_port | int <= 65535

- name: Check Docker Engine availability
  ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
  changed_when: false

- name: Check Docker Compose availability
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false

- name: Require Compose with up --wait support
  ansible.builtin.assert:
    that: (compose_version.stdout | trim | regex_replace('^v', '')) is version('2.20.0', '>=')

- name: Create environment directory
  ansible.builtin.file:
    path: "{{ release_base }}"
    state: directory
    mode: "0700"

# Atomic mkdir also serializes direct release.py calls, not only GitHub workflow runs.
- name: Acquire environment deployment lock (do not remove a live lock)
  ansible.builtin.command:
    argv: [mkdir, "{{ release_base }}/.deploy-lock"]
  changed_when: true

- name: Deploy while holding the environment lock
  block:
    - name: Create immutable release directories
      ansible.builtin.file:
        path: "{{ release_path }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [docker, docker/mongo, env, scripts]

    - name: Copy tracked Compose manifests (no source tree or local overrides)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ release_path }}/docker/{{ item }}"
        mode: "0600"
      loop:
        [
          docker-compose.yml,
          docker-compose.release.yml,
          mongo/start.sh,
          mongo/init.js,
          mongo/health.js,
          docker-compose.preserve-data.yml,
        ]

    - name: Install portable Mongo backup and compatibility utilities
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/{{ item }}"
        dest: "{{ release_path }}/scripts/{{ item }}"
        mode: "0600"
      loop: [mongo-backup.py, mongo_runtime.py]

    - name: Install non-secret environment settings for this release
      ansible.builtin.copy:
        src: "{{ release_env_file }}"
        dest: "{{ release_path }}/env/.env"
        mode: "0600"
      no_log: true
      diff: false

    - name: Install secret environment settings separately
      ansible.builtin.copy:
        src: "{{ release_secret_env_file }}"
        dest: "{{ release_path }}/env/secret.env"
        mode: "0600"
      no_log: true
      diff: false

    - name: Create temporary registry configuration
      ansible.builtin.tempfile:
        state: directory
        prefix: repaircalc-docker-
      register: registry_config

    - name: Pull and start the release
      environment:
        DOCKER_CONFIG: "{{ registry_config.path }}"
        IMAGE_PREFIX: "{{ release_image_prefix }}"
        IMAGE_TAG: "{{ release_image_tag }}"
        FRONTEND_BIND_ADDRESS: "{{ release_frontend_host }}"
        FRONTEND_PUBLIC_PORT: "{{ release_frontend_port | string }}"
        COMPOSE_PROFILES: "{{ 'llm' if release_llm_enabled | default(false) | bool else '' }}"
        COMPOSE_IGNORE_ORPHANS: "true"
      block:
        - name: Inspect frontend ownership and verify the existing database before any restart
          ansible.builtin.script:
            cmd: "{{ (playbook_dir ~ '/../../scripts/deploy_target.py') | quote }} plan --path {{ release_path | quote }} --base {{ release_base | quote }} --project {{ release_project | quote }} --environment {{ release_environment | quote }} --host {{ release_frontend_host | quote }} --port {{ release_frontend_port }}"
            executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          register: deployment_target_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Require a verified deployment target (no automatic port eviction or database switch)
          ansible.builtin.assert:
            that: deployment_target_check.rc | default(1) == 0
            fail_msg: "{{ (deployment_target_check.stdout | from_json).get('error', 'Deployment target inspection failed') if deployment_target_check.stdout | default('') is match('^[{]') else 'Deployment target inspection failed; no services were restarted' }}"
          no_log: false

        - name: Select the verified Compose project and database
          ansible.builtin.set_fact:
            release_target: "{{ deployment_target_check.stdout | from_json }}"
            release_project: "{{ (deployment_target_check.stdout | from_json).project }}"
          no_log: true

        - name: Show selected project and data preservation strategy
          ansible.builtin.debug:
            msg: "project={{ release_target.project }}; volume={{ release_target.volume }}; adopted_legacy={{ release_target.adopted_legacy }}; preserve_catalog={{ release_target.preserve_catalog }}"
          no_log: false

        - name: Preserve published catalog and admin data in an initialized database
          ansible.builtin.set_fact:
            release_compose: "{{ release_compose + ['-f', release_path ~ '/docker/docker-compose.preserve-data.yml'] }}"
          when: release_target.preserve_catalog | bool

        - name: Record the verified target for private backup and troubleshooting
          ansible.builtin.copy:
            dest: "{{ release_path }}/deployment-target.json"
            content: "{{ release_target | to_nice_json }}"
            mode: "0600"
          diff: false

        - name: Authenticate to GHCR without storing credentials permanently
          ansible.builtin.command:
            argv:
              [
                docker,
                login,
                ghcr.io,
                --username,
                "{{ release_registry_username }}",
                --password-stdin,
              ]
            stdin: "{{ release_registry_password }}"
          when: release_registry_username | length > 0
          no_log: true
          changed_when: false

        - name: Validate Compose without printing interpolated secrets
          ansible.builtin.command:
            argv: "{{ release_compose + ['config', '--quiet'] }}"
          changed_when: false
          no_log: true

        - name: Pull all required images before changing running services
          ansible.builtin.command:
            argv: "{{ release_compose + ['pull'] + release_pull_services }}"
          changed_when: true
          no_log: true

        - name: Back up the existing database and check the archive before changing services
          ansible.builtin.script:
            cmd: "{{ (playbook_dir ~ '/../../scripts/deploy_target.py') | quote }} backup --path {{ release_path | quote }}"
            executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          when: release_target.existing_database | bool
          register: deployment_backup
          failed_when: false
          no_log: true

        - name: Require a completed database backup
          ansible.builtin.assert:
            that: deployment_backup.rc | default(1) == 0
            fail_msg: "Database backup/archive check failed; release images were not started"
          when: release_target.existing_database | bool
          no_log: false

        # Persist before the first restart, including failed deployments, so retries cannot
        # silently select the other database when a frontend is temporarily stopped.
        - name: Pin the existing project and database volume before restarting
          ansible.builtin.copy:
            dest: "{{ release_base }}/compose-project.json"
            content: "{{ {'project': release_target.project, 'volume': release_target.volume} | to_nice_json }}"
            mode: "0600"
          diff: false
          when: release_target.existing_database | bool

        - name: Recreate the bootstrap gate (seed only an uninitialized database)
          ansible.builtin.command:
            argv: "{{ release_compose + ['rm', '--force', 'init-data'] }}"
          changed_when: true
          no_log: true

        - name: Start base services and wait for their healthchecks (no build or model download)
          ansible.builtin.command:
            argv: "{{ release_compose + ['up', '--detach', '--no-build', '--pull', 'never', '--wait', '--wait-timeout', release_wait_timeout | string] + release_services }}"
          changed_when: true
          no_log: true

        - name: Check frontend through the published port
          ansible.builtin.uri:
            url: "http://{{ release_frontend_health_address }}:{{ release_frontend_port }}/healthz"
            status_code: 200
            use_proxy: false
          register: frontend_health
          until: frontend_health.status | default(0) == 200
          retries: 6
          delay: 5

        - name: Check Java catalog through the frontend API proxy
          ansible.builtin.uri:
            url: "http://{{ release_frontend_health_address }}:{{ release_frontend_port }}/api/v1/products"
            status_code: 200
            return_content: true
            use_proxy: false
          register: catalog_check
          failed_when: catalog_check.status != 200 or catalog_check.x_repaircalc_degraded is defined or (catalog_check.json | default([]) | length) == 0
          no_log: true

        - name: Pin a newly initialized database only after successful health and API checks
          ansible.builtin.copy:
            dest: "{{ release_base }}/compose-project.json"
            content: "{{ {'project': release_target.project, 'volume': release_target.volume} | to_nice_json }}"
            mode: "0600"
          diff: false
          when: not release_target.existing_database | bool

        - name: Mark the release successful only after health and API checks
          ansible.builtin.file:
            src: "{{ release_path }}"
            dest: "{{ release_base }}/current"
            state: link
            force: true
      rescue:
        - name: Save bounded failure details privately on the stand
          ansible.builtin.copy:
            dest: "{{ release_path }}/deployment-failure.json"
            content: "{{ {'rc': ansible_failed_result.rc | default(-1), 'stdout': (ansible_failed_result.stdout | default(''))[-16384:], 'stderr': (ansible_failed_result.stderr | default(''))[-16384:]} | to_json }}"
            mode: "0600"
          no_log: true
          diff: false
          failed_when: false

        - name: Collect private container logs and safe deployment status
          ansible.builtin.script:
            cmd: "{{ (playbook_dir ~ '/../../scripts/deploy_diagnostics.py') | quote }} --release-path {{ release_path | quote }} --project {{ release_project | quote }}"
            executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          register: deployment_diagnostics
          failed_when: false
          changed_when: false
          no_log: true

        - name: Prepare safe diagnostic summary
          ansible.builtin.set_fact:
            release_diagnostic_summary: "{{ (deployment_diagnostics.stdout | from_json) if deployment_diagnostics.rc | default(1) == 0 else {'status': 'diagnostics_collection_failed', 'private_failure_file': release_path ~ '/deployment-failure.json'} }}"
          no_log: true

        - name: Show safe deployment diagnostic summary (no raw logs or secrets)
          ansible.builtin.debug:
            var: release_diagnostic_summary
          no_log: false

        - name: Fail deployment without hiding the diagnostic location
          ansible.builtin.fail:
            msg: "Deployment failed. See the safe status summary above and private diagnostics under {{ release_path }}. Raw logs may contain secrets; do not publish them unreviewed. No automatic rollback was performed."
          no_log: false
      always:
        - name: Remove temporary registry credentials
          ansible.builtin.file:
            path: "{{ registry_config.path }}"
            state: absent
          no_log: true
  always:
    - name: Release environment deployment lock
      ansible.builtin.file:
        path: "{{ release_base }}/.deploy-lock"
        state: absent
