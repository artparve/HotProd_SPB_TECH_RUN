# Runtime-only overrides; Ansible always uses --no-build.
services:
  backend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
  init-data:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
  llm:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/llm:${IMAGE_TAG:?Set IMAGE_TAG}
  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/frontend:${IMAGE_TAG:?Set IMAGE_TAG}
