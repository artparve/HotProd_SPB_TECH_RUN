# Used only with docker-compose.yml by Ansible. Never builds on the deployment host.
services:
  backend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
  init-data:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
  estimator:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/estimator:${IMAGE_TAG:?Set IMAGE_TAG}
  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - target: 8080
        published: "${FRONTEND_PORT:-8080}"
        host_ip: "${FRONTEND_HOST:-127.0.0.1}"
  classifier:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/classifier:${IMAGE_TAG:?Set IMAGE_TAG}
  classifier-worker:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/classifier:${IMAGE_TAG:?Set IMAGE_TAG}
